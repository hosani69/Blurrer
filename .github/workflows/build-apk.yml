name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Blurrer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Blurrer-apk
          path: Blurrer.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Blurrer build ${{ github.run_number }}
          make_latest: true
          body: |
            Download **Blurrer.apk** below on your Android phone and open it to install.
            Built from ${{ github.sha }}.
          files: Blurrer.apk
